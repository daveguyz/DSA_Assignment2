services:

  mongodb:
    image: mongo:latest
    container_name: fooddelivery-mongo
    ports:
      - "27017:27017"
    volumes:
      - fooddelivery-mongo-data:/data/db

  kafka:
    image: apache/kafka:4.3.1
    container_name: fooddelivery-kafka
    ports:
      - "9092:9092"

  customer-service:
    image: customer_service:latest
    container_name: customer-service
    ports:
      - "8081:8081"
    networks:
      - default
    volumes:
      - ./customer-service/Config.toml:/home/ballerina/Config.toml

  restaurant-service:
    image: restaurant_service:latest
    container_name: restaurant-service
    ports:
      - "8082:8082"
    networks:
      - default
    volumes:
      - ./restaurant-service/Config.toml:/home/ballerina/Config.toml

  order-service:
    image: order_service:latest
    container_name: order-service
    ports:
      - "8083:8083"
    networks:
      - default
    volumes:
      - ./order-service/Config.toml:/home/ballerina/Config.toml

  payment-service:
    image: payment_service:latest
    container_name: payment-service
    ports:
      - "8084:8084"
    networks:
      - default
    volumes:
      - ./payment-service/Config.toml:/home/ballerina/Config.toml

  delivery-service:
    image: delivery_service:latest
    container_name: delivery-service
    ports:
      - "8085:8085"
    networks:
      - default
    volumes:
      - ./delivery-service/Config.toml:/home/ballerina/Config.toml

  notification-service:
    image: notification_service:latest
    container_name: notification-service
    ports:
      - "8086:8086"
    networks:
      - default
    volumes:
      - ./notification-service/Config.toml:/home/ballerina/Config.toml

  admin-service:
    image: admin_service:latest
    container_name: admin-service
    ports:
      - "8087:8087"
    networks:
      - default
    volumes:
      - ./admin-service/Config.toml:/home/ballerina/Config.toml

volumes:
  fooddelivery-mongo-data:
    name: fooddelivery-mongo-data

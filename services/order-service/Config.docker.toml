# Runtime configuration used inside Docker (copied to /app/Config.toml).
# Local 'bal run' uses the defaults in the code (Kafka localhost:29092, MySQL localhost:3307).
httpPort = 9093
kafkaBootstrap = "kafka:9092"
dbHost = "mysql"
dbPort = 3306
customerServiceUrl = "http://customer-service:9091"
deliveryServiceUrl = "http://delivery-service:9095"
baseDeliveryFee = 15.00
perKmFee = 5.00
maxSurgeMultiplier = 2.5
utcOffsetHours = 2

[ballerina.observe]
metricsEnabled = true
metricsReporter = "prometheus"

[ballerinax.prometheus]
host = "0.0.0.0"
port = 9797

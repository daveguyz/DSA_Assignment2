# Static UI + API gateway: /api/<resource>/... is routed to the owning microservice.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location ^~ /api/customers     { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://customer-service:9091; }
    location ^~ /api/restaurants   { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://restaurant-service:9092; }
    location ^~ /api/orders        { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://order-service:9093; }
    location ^~ /api/pricing       { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://order-service:9093; }
    location ^~ /api/payments      { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://payment-service:9094; }
    location ^~ /api/drivers       { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://delivery-service:9095; }
    location ^~ /api/deliveries    { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://delivery-service:9095; }
    location ^~ /api/routes        { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://delivery-service:9095; }
    location ^~ /api/notifications { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://notification-service:9096; }
    location ^~ /api/admin         { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://admin-service:9097; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
